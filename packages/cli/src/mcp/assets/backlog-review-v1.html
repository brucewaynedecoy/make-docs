<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backlog review</title>
<style>
    :root {
      color-scheme: light dark;
      --ink: #15213c;
      --muted: #5d6b82;
      --paper: #f5f7fb;
      --panel: #ffffff;
      --copy: #34415a;
      --detail: #eef3ff;
      --detail-copy: #42506a;
      --line: #d7deea;
      --line-strong: #aeb9ca;
      --blue: #3159d8;
      --blue-soft: #e9efff;
      --accent: #3159d8;
      --accent-line: #7187b6;
      --phase-complete: #70ad9a;
      --phase-open: #829de0;
      --phase-blocked: #d77d87;
      --phase-conflict: #d5a158;
      --phase-superseded: #a7afbc;
      --phase-unknown: #dfe4ec;
      --wave-current: #3159d8;
      --wave-current-soft: #e9efff;
      --wave-attention: #9a5a10;
      --wave-attention-soft: #fff0db;
      --wave-conflict: #a6333d;
      --wave-conflict-soft: #fdebee;
      --wave-deferred: #6750a4;
      --wave-deferred-soft: #f0ebff;
      --wave-complete: #246b58;
      --wave-complete-soft: #e4f4ee;
      --wave-history: #5f6b7e;
      --wave-history-soft: #edf0f5;
      --button-text: #ffffff;
      --focus: #005fcc;
      --radius: 5px;
      --measure: 72ch;
      font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
      font-synthesis: none;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; }
    }

    :root[data-theme="light"] { color-scheme: light; }

    :root[data-theme="dark"] {
        --ink: #f5f5f7;
        --muted: #a6a6b0;
        --paper: #111111;
        --panel: #191919;
        --copy: #dedee3;
        --detail: #202022;
        --detail-copy: #d7d7dd;
        --line: #2d2d33;
        --line-strong: #484850;
        --blue: #75adff;
        --blue-soft: #1c1c22;
        --accent: #75adff;
        --accent-line: #3e5f8a;
        --phase-complete: #469c7e;
        --phase-open: #527fca;
        --phase-blocked: #ca5362;
        --phase-conflict: #bd873e;
        --phase-superseded: #687282;
        --phase-unknown: #242429;
        --wave-current: #75adff;
        --wave-current-soft: #13243d;
        --wave-attention: #f2b65f;
        --wave-attention-soft: #352510;
        --wave-conflict: #ff7888;
        --wave-conflict-soft: #3a171e;
        --wave-deferred: #b9a2ff;
        --wave-deferred-soft: #271f40;
        --wave-complete: #68d4aa;
        --wave-complete-soft: #113126;
        --wave-history: #c1c7d0;
        --wave-history-soft: #252c37;
        --button-text: #111111;
        --focus: #91bdff;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #f5f5f7;
        --muted: #a6a6b0;
        --paper: #111111;
        --panel: #191919;
        --copy: #dedee3;
        --detail: #202022;
        --detail-copy: #d7d7dd;
        --line: #2d2d33;
        --line-strong: #484850;
        --blue: #75adff;
        --blue-soft: #1c1c22;
        --accent: #75adff;
        --accent-line: #3e5f8a;
        --phase-complete: #469c7e;
        --phase-open: #527fca;
        --phase-blocked: #ca5362;
        --phase-conflict: #bd873e;
        --phase-superseded: #687282;
        --phase-unknown: #242429;
        --wave-current: #75adff;
        --wave-current-soft: #13243d;
        --wave-attention: #f2b65f;
        --wave-attention-soft: #352510;
        --wave-conflict: #ff7888;
        --wave-conflict-soft: #3a171e;
        --wave-deferred: #b9a2ff;
        --wave-deferred-soft: #271f40;
        --wave-complete: #68d4aa;
        --wave-complete-soft: #113126;
        --wave-history: #c1c7d0;
        --wave-history-soft: #252c37;
        --button-text: #111111;
        --focus: #91bdff;
      }
    }

    :root[data-theme="dark"] .masthead { border-top-color: var(--line-strong); }
    :root[data-theme="dark"] .section-heading { border-bottom-color: var(--line-strong); }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .masthead { border-top-color: var(--line-strong); }
      :root:not([data-theme="light"]) .section-heading { border-bottom-color: var(--line-strong); }
    }

    * { box-sizing: border-box; }
    html, body { background: var(--paper); }
    body { margin: 0; color: var(--ink); line-height: 1.5; }
    button, input, select { font: inherit; }
    button, a, input, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 32%, transparent);
      outline-offset: 2px;
    }
    a { color: var(--blue); text-underline-offset: .16em; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    .shell { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 72px; }
    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: start;
      border-top: 7px solid var(--ink);
      border-bottom: 1px solid var(--line-strong);
      padding: 24px 0 28px;
    }
    h1 { max-width: 18ch; margin: 0; font-size: clamp(2.2rem, 5vw, 5.4rem); font-weight: 650; letter-spacing: -.055em; line-height: .98; }
    .lead { max-width: var(--measure); margin: 22px 0 0; color: var(--copy); font-size: clamp(1.03rem, 1.6vw, 1.3rem); line-height: 1.55; }
    .report-meta { min-width: 230px; margin: 4px 0 0; border-left: 1px solid var(--line); padding-left: 24px; }
    .report-meta div + div { margin-top: 15px; }
    .report-meta dt { color: var(--muted); font-size: .76rem; }
    .report-meta dd { margin: 2px 0 0; font-weight: 650; }
    .project-link { text-decoration-color: var(--line-strong); }
    #projectLink, #projectFooterLink { color: var(--accent); }
    .meta-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 8px; }
    .meta-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 33px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      padding: 7px 10px;
      font-size: .78rem;
      line-height: 1;
      cursor: pointer;
    }
    .theme-button::before { width: 12px; height: 12px; border: 1px solid currentColor; border-radius: 50%; background: linear-gradient(90deg, currentColor 50%, transparent 50%); content: ""; }
    .print-button svg { width: 13px; height: 13px; stroke: currentColor; }
    .snapshot-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line-strong); }
    .metric { min-width: 0; padding: 18px 14px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric strong { display: block; font-size: 1.65rem; line-height: 1; }
    .metric span { color: var(--muted); font-size: .82rem; }
    .workspace { display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 42px; padding-top: 42px; }
    .attention { align-self: start; position: sticky; top: 18px; }
    .section-heading { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin: 0 0 14px; border-bottom: 2px solid var(--ink); padding-bottom: 9px; }
    .section-heading h2 { margin: 0; font-size: 1rem; font-weight: 750; letter-spacing: -.01em; }
    .attention-list, .order-list { margin: 0; padding: 0; list-style: none; }
    .attention-item, .order-item { border-bottom: 1px solid var(--line); }
    .report-action, .backlog-finding { display: grid; width: 100%; grid-template-columns: 32px 1fr; gap: 12px; border: 0; background: transparent; color: inherit; padding: 16px 0; text-align: left; }
    .report-action { cursor: pointer; }
    .report-action:hover { background: color-mix(in srgb, var(--blue-soft) 28%, transparent); }
    .report-action:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .attention-icon, .order-number { width: 28px; min-height: 23px; display: grid; place-items: center; align-self: start; }
    .attention-icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .attention-item.info .attention-icon { color: var(--wave-current); }
    .attention-item.warning .attention-icon { color: var(--wave-attention); }
    .attention-item.error .attention-icon { color: var(--wave-conflict); }
    .action-copy { min-width: 0; }
    .action-detail { display: block; margin-top: 4px; color: var(--muted); font-size: .82rem; }
    .attention-item strong, .order-item strong { display: block; font-size: .9rem; }
    .action-coordinate { display: block; margin-bottom: 3px; color: var(--muted); font-size: .72rem; font-weight: 700; }
    .attention > section:not([hidden]) + section:not([hidden]) { margin-top: 42px; }
    .order-item .report-action { padding: 13px 0; }
    .order-number { padding: 3px; font-size: .7rem; background: var(--paper); color: var(--ink); }
    .ledger { min-width: 0; }
    .backlog-tabs { display: flex; gap: 18px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
    .backlog-tab { min-height: 38px; margin-bottom: -1px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); padding: 6px 2px; font-size: .82rem; cursor: pointer; }
    .backlog-tab[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 700; }
    .backlog-panel[hidden] { display: none; }
    .controls { margin-bottom: 28px; }
    .search-wrap { position: relative; }
    .search-wrap::before { position: absolute; left: 13px; top: 50%; width: 12px; height: 12px; border: 2px solid var(--muted); border-radius: 50%; content: ""; transform: translateY(-58%); pointer-events: none; }
    .search-wrap::after { position: absolute; left: 25px; top: 57%; width: 7px; height: 2px; background: var(--muted); content: ""; transform: rotate(45deg); pointer-events: none; }
    #search { width: 100%; min-height: 43px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); padding: 9px 48px 9px 42px; }
    #search::-webkit-search-cancel-button { -webkit-appearance: none; }
    .search-clear { position: absolute; right: 5px; top: 50%; width: 34px; min-height: 34px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); padding: 0; transform: translateY(-50%); cursor: pointer; }
    .search-clear:hover { color: var(--ink); }
    .search-clear[hidden] { display: none; }
    .search-clear svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 1.8; }
    .ledger-tools { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 14px; }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 0 0 13px; }
    .filter-button { min-height: 34px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); padding: 6px 12px; font-size: .8rem; cursor: pointer; }
    .filter-button:hover, .filter-button:focus-visible, .filter-button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--button-text); }
    .filter-button[data-filter="attention"] { --filter-color: var(--wave-attention); --filter-soft: var(--wave-attention-soft); }
    .filter-button[data-filter="current"] { --filter-color: var(--wave-current); --filter-soft: var(--wave-current-soft); }
    .filter-button[data-filter="conflict"] { --filter-color: var(--wave-conflict); --filter-soft: var(--wave-conflict-soft); }
    .filter-button[data-filter="deferred"] { --filter-color: var(--wave-deferred); --filter-soft: var(--wave-deferred-soft); }
    .filter-button[data-filter="complete"] { --filter-color: var(--wave-complete); --filter-soft: var(--wave-complete-soft); }
    .filter-button[data-filter="history"], .filter-button[data-filter="archived"] { --filter-color: var(--wave-history); --filter-soft: var(--wave-history-soft); }
    .filter-button[data-semantic]:hover, .filter-button[data-semantic]:focus-visible, .filter-button[data-semantic][aria-pressed="true"] { border-color: color-mix(in srgb, var(--filter-color) 55%, var(--line)); background: var(--filter-soft); color: var(--filter-color); }
    .sort-controls { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; padding-bottom: 14px; }
    #sortBy, #sortDirection { min-height: 34px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); font-size: .78rem; }
    #sortBy { padding: 5px 28px 5px 9px; }
    #sortDirection { width: 34px; min-width: 34px; padding: 0; display: grid; place-items: center; cursor: pointer; }
    .sort-direction-icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.6; }
    .sort-direction-icon.ascending { display: none; }
    #sortDirection[data-direction="asc"] .ascending { display: block; }
    #sortDirection[data-direction="asc"] .descending { display: none; }
    .result-note { margin: 0 0 12px; color: var(--muted); font-size: .8rem; }
    .wave-list { border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 82%, transparent); }
    .wave { border-bottom: 1px solid var(--line); }
    .wave-overview { display: grid; grid-template-columns: minmax(150px, .8fr) minmax(240px, 1.35fr) minmax(250px, 1.8fr); gap: 22px; align-items: start; padding: 22px 4px 14px; cursor: pointer; }
    .wave-overview:hover { background: color-mix(in srgb, var(--blue-soft) 20%, transparent); }
    .wave-overview:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .wave-title { padding-bottom: 8px; }
    .wave-title a { color: var(--ink); font-size: 1.05rem; font-weight: 760; text-decoration: none; }
    .wave-title a:hover { text-decoration: underline; }
    .wave-title p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; }
    .wave-summary { padding-bottom: 8px; color: var(--copy); font-size: .88rem; }
    .wave-summary p { margin: 4px 0 0; padding-bottom: 4px; color: var(--muted); }
    .badge { display: inline-flex; width: fit-content; color: var(--muted); padding: 3px 8px; font-size: .7rem; font-weight: 650; }
    .badge.current { background: var(--wave-current-soft); color: var(--wave-current); }
    .badge.attention { background: var(--wave-attention-soft); color: var(--wave-attention); }
    .badge.conflict { background: var(--wave-conflict-soft); color: var(--wave-conflict); }
    .badge.deferred { background: var(--wave-deferred-soft); color: var(--wave-deferred); }
    .badge.complete { background: var(--wave-complete-soft); color: var(--wave-complete); }
    .badge.history { background: var(--wave-history-soft); color: var(--wave-history); }
    .wave-status { margin-bottom: 9px; }
    .track { display: grid; grid-template-columns: repeat(var(--phase-count), minmax(18px, 1fr)); gap: 2px; min-height: 10px; }
    .phase { min-height: 10px; border: 1px solid var(--line-strong); background: var(--phase-unknown); }
    .phase.complete { border-color: var(--phase-complete); background: var(--phase-complete); }
    .phase.open { border-color: var(--phase-open); background: var(--phase-open); }
    .phase.blocked { border-color: var(--phase-blocked); background: var(--phase-blocked); }
    .phase.conflict { border-color: var(--phase-conflict); background: var(--phase-conflict); }
    .phase.superseded { border-color: var(--phase-superseded); background: var(--phase-superseded); }
    .track-stats { margin-top: 7px; color: var(--muted); font-size: .73rem; }
    .detail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin: 0 4px 2px; border-left: 3px solid var(--blue); background: var(--detail); padding: 18px 20px; font-size: .82rem; }
    .detail[hidden] { display: none; }
    .detail h3 { margin: 0 0 6px; font-size: .8rem; }
    .claim-list { margin: 0; padding-left: 18px; color: var(--detail-copy); }
    .claim-list li + li { margin-top: 8px; }
    .claim-copy { margin: 0; color: var(--detail-copy); }
    .claim-copy + .claim-copy { margin-top: 8px; }
    .empty { border-bottom: 1px solid var(--line); padding: 48px 16px; text-align: center; color: var(--muted); }
    .legends { margin-top: 24px; }
    .legend-block h2 { margin: 0 0 12px; font-size: .88rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px 24px; color: var(--muted); font-size: .75rem; }
    .legend span { display: inline-flex; gap: 7px; align-items: center; }
    .legend i { width: 30px; height: 14px; flex: 0 0 auto; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--phase-unknown); }
    .legend .complete { background: var(--phase-complete); border-color: var(--phase-complete); }
    .legend .open { background: var(--phase-open); border-color: var(--phase-open); }
    .legend .blocked { background: var(--phase-blocked); border-color: var(--phase-blocked); }
    .legend .conflict { background: var(--phase-conflict); border-color: var(--phase-conflict); }
    .legend .superseded { background: var(--phase-superseded); border-color: var(--phase-superseded); }
    .data-copy { max-width: var(--measure); margin: 0; color: var(--muted); font-size: .82rem; }
    .data-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .data-view { max-height: 34rem; margin: 16px 0 0; overflow: auto; border: 1px solid var(--line); background: var(--panel); padding: 16px; color: var(--copy); font: .75rem/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre; tab-size: 2; }
    .data-view[hidden] { display: none; }
    footer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 30px; margin-top: 48px; border-top: 1px solid var(--line-strong); padding-top: 20px; color: var(--muted); font-size: .78rem; }
    footer p { max-width: var(--measure); margin: 0; }

    @media (max-width: 1080px) {
      .workspace { grid-template-columns: 1fr; }
      .attention { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
      .attention > section:not([hidden]) + section:not([hidden]) { margin-top: 0; }
      .wave-overview { grid-template-columns: minmax(140px, .8fr) minmax(220px, 1.2fr) minmax(220px, 1.4fr); gap: 16px; }
    }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 680px); padding-top: 16px; }
      .masthead { grid-template-columns: 1fr; gap: 18px; }
      .report-meta { border-left: 0; border-top: 1px solid var(--line); padding: 15px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .report-meta div + div { margin-top: 0; }
      .meta-actions { grid-column: 1 / -1; margin-top: 2px; }
      .attention { display: block; }
      .attention > section:not([hidden]) + section:not([hidden]) { margin-top: 42px; }
      .ledger-tools { flex-direction: column; align-items: stretch; }
      .sort-controls { justify-content: flex-start; }
      .wave-overview { grid-template-columns: 1fr; gap: 10px; padding: 20px 2px 12px; }
      .detail { grid-template-columns: 1fr; margin-inline: 2px; }
      footer { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .snapshot-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { border-bottom: 1px solid var(--line); }
      .metric:nth-child(even) { border-right: 0; }
      .metric:nth-last-child(-n + 2) { border-bottom: 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
      .wave { transition: opacity 120ms ease; }
    }
    @media print {
      :root, :root[data-theme="light"], :root[data-theme="dark"] { color-scheme: light; --ink: #15213c; --muted: #5d6b82; --paper: #ffffff; --panel: #ffffff; --copy: #34415a; --detail: #eef3ff; --detail-copy: #42506a; --line: #d7deea; --line-strong: #aeb9ca; --blue: #3159d8; --blue-soft: #e9efff; --phase-complete: #70ad9a; --phase-open: #829de0; --phase-blocked: #d77d87; --phase-conflict: #d5a158; --phase-superseded: #a7afbc; --phase-unknown: #dfe4ec; --wave-current: #3159d8; --wave-current-soft: #e9efff; --wave-attention: #9a5a10; --wave-attention-soft: #fff0db; --wave-conflict: #a6333d; --wave-conflict-soft: #fdebee; --wave-deferred: #6750a4; --wave-deferred-soft: #f0ebff; --wave-complete: #246b58; --wave-complete-soft: #e4f4ee; --wave-history: #5f6b7e; --wave-history-soft: #edf0f5; --button-text: #ffffff; }
      :root, :root[data-theme="light"], :root[data-theme="dark"] { --accent: #3159d8; --accent-line: #7187b6; }
      .shell { width: 100%; padding: 0; }
      .controls, .filters, .sort-controls, .meta-actions, .backlog-tabs, #dataPanel { display: none !important; }
      #workPanel { display: block !important; }
      .workspace { display: block; }
      .attention { position: static; margin-bottom: 28px; }
      .wave[hidden] { display: none; }
      .wave { break-inside: avoid; }
      .detail[hidden] { display: grid !important; }
      .report-action { color: var(--ink); cursor: default; }
      .report-action:hover { background: transparent; }
    }
  </style>
<style>[hidden] { display: none !important; }</style>
</head>
<body>
