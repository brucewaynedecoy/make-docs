name: Platform safety

on:
  pull_request:
    paths:
      - "packages/cli/src/**"
      - "packages/cli/tests/**"
      - ".github/workflows/platform-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-contract:
    name: ${{ matrix.os }} platform contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm exec -- tsc --noEmit -p packages/cli/tsconfig.json

      - name: Run platform safety contracts
        run: >-
          npm test -w packages/cli --
          tests/w22-r0-p3-platform-safety.test.ts
          tests/installation-state.test.ts
          tests/resource-resolver.test.ts
          tests/w19-r6-harness-adapters.test.ts
          tests/w19-r6-harness-system-operations.test.ts
